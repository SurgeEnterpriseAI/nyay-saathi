# Production compose file. Settings come from .env.production on the server (never committed).
# Usage data lives in the named volume, which redeploys never touch.
services:
  app:
    image: nyay-saathi:latest
    build: .
    restart: unless-stopped
    env_file: .env.production
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${HOST_PORT:-6690}:8080"
    volumes:
      - nyay-data:/data
    mem_limit: 256m

volumes:
  nyay-data:
